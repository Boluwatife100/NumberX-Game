<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NumberX</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Work+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <header class="header">
      <h1 class="title">Crack the vault</h1>
      <button class="btn again">Again!</button>
    </header>

    <main class="game-card">
      <p class="hint">
        Pick a number between <strong>1</strong> and <strong>20</strong>
      </p>

      <div class="dial">
        <span class="number">?</span>
      </div>

      <p class="message">Start guessing&hellip;</p>

      <div class="controls">
        <input
          type="number"
          class="guess"
          min="1"
          max="20"
          placeholder="Your guess"
        />
        <button class="btn check">Check!</button>
      </div>

      <div class="stats">
        <div class="stat">
          <span class="stat-value score">20</span>
          <span class="stat-label">Score</span>
        </div>
        <div class="stat">
          <span class="stat-value highscore">0</span>
          <span class="stat-label">Best</span>
        </div>
      </div>
    </main>

    <script src="src/main.js"></script>
  </body>
</html>
